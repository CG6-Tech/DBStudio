<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DBStudio Showreel — Intro Animation</title>
    <link rel="stylesheet" href="./showreel.css" />
  </head>
  <body>
    <main class="stage" aria-label="DBStudio animated showreel intro">
      <div class="grid"></div>
      <div class="ambient ambient-one"></div>
      <div class="ambient ambient-two"></div>

      <section class="intro">
        <div class="logo" aria-hidden="true">
          <span class="box box-top"></span>
          <span class="box box-mid"></span>
          <span class="box box-bottom"></span>
        </div>

        <div class="copy">
          <p class="eyebrow">local-first database tooling</p>
          <h1>
            <span class="title-base">Introducing DBStudio</span>
            <span class="title-shimmer">Introducing DBStudio</span>
          </h1>
          <p class="subline">
            A visual workspace for schemas, relationships, triggers, and procedures.
          </p>
          <div class="underline"></div>
        </div>
      </section>
    </main>
  </body>
</html>
