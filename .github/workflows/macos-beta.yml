name: macOS beta

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos-beta:
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            artifact: DBStudio-0.1.0-beta.1-macos-apple-silicon
          - target: x86_64-apple-darwin
            artifact: DBStudio-0.1.0-beta.1-macos-intel
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Build DMG installer
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles dmg
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Create SHA-256 checksum
        run: find src-tauri/target/${{ matrix.target }}/release/bundle/dmg -name '*.dmg' -print0 | xargs -0 shasum -a 256 > src-tauri/target/${{ matrix.target }}/release/bundle/dmg/SHA256.txt

      - name: Upload macOS beta installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/SHA256.txt
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error
          retention-days: 14
