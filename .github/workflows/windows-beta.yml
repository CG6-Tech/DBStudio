name: Windows beta

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-beta:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Build Windows NSIS installer
        run: npm run tauri build -- --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Create SHA-256 checksum
        shell: pwsh
        run: Get-FileHash src-tauri/target/release/bundle/nsis/*.exe -Algorithm SHA256 | Format-List | Out-File src-tauri/target/release/bundle/nsis/SHA256.txt

      - name: Upload Windows beta installer
        uses: actions/upload-artifact@v4
        with:
          name: DBStudio-0.1.0-beta.1-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/nsis/SHA256.txt
          if-no-files-found: error
          retention-days: 14
