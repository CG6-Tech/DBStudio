[package]
name = "viewdb"
version = "0.1.0"
description = "A source-preserving PostgreSQL ER editor sample"
authors = ["ViewDB contributors"]
edition = "2021"

[lib]
name = "viewdb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = "0.4"
hex = "0.4"
pg_query = "6.1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
